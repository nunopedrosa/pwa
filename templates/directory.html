<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b28">
  <meta name="description" content="The BaseCentral app catalogue. Find and open the apps in one place.">
  <meta name="directory-config" content="{{CONFIG_HASH}}">
  <title>BaseCentral — App catalogue</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v={{STYLE_VERSION}}">
</head>
<body>
  <div class="scene" aria-hidden="true"></div>
  <a class="skip-link" href="#apps">Skip to apps</a>
  <div class="shell">
    <header class="masthead">
      <a class="brand" href="./" aria-label="BaseCentral home"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="m16 2 14 14-14 14L2 16Z"/><path d="m16 10 6 6-6 6-6-6Z"/></svg><span>BaseCentral</span></a>
      <span class="site-address">basecentral.link</span>
    </header>
    <main>
      <div class="introduction"><h1>App catalogue</h1><p>Choose an app to open it.</p></div>
      <nav id="apps" aria-label="Apps" tabindex="-1">
        <ul class="directory">
{{APP_LINKS}}
        </ul>
      </nav>
    </main>
    <footer><span>BaseCentral</span><p>Each app opens on its own website.</p></footer>
  </div>
</body>
</html>
