<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10151d">
  <meta name="description" content="Base Central — your gateway to connected spaces.">
  <title>Base Central</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10151d;
      color: #f5f7fa
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden
    }

    .scene {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: #171d27
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: -3%;
      background-image: url('assets/BaseCentral.jpg');
      background-position: center 52%;
      background-size: cover;
      background-repeat: no-repeat;
      filter: saturate(.87) contrast(1.04)
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(6, 12, 20, .74) 0%, rgba(6, 12, 20, .08) 29%, rgba(6, 12, 20, .1) 55%, rgba(6, 12, 20, .78) 100%)
    }

    .shell {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: clamp(20px, 3vw, 48px);
      padding-top: max(clamp(20px, 3vw, 48px), env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }

    header,
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(14px, 1.5vw, 19px);
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
      text-decoration: none;
      color: inherit
    }

    .mark {
      width: 30px;
      height: 30px;
      border: 2px solid #89dfff;
      transform: rotate(45deg);
      display: grid;
      place-items: center
    }

    .mark span {
      transform: rotate(-45deg);
      font-size: 15px;
      letter-spacing: 0;
      color: #89dfff
    }

    .status {
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #c4d7e1;
      white-space: nowrap
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #8be5d4;
      border-radius: 50%;
      box-shadow: 0 0 12px #8be5d4;
      margin-right: 9px
    }

    main {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      text-align: center;
      padding: 40px 0 clamp(30px, 7vh, 90px)
    }

    .panel {
      max-width: 670px;
      padding: 20px 28px 24px;
      background: rgba(8, 14, 22, .48);
      border: 1px solid rgba(193, 222, 238, .2);
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
      box-shadow: 0 15px 60px rgba(0, 0, 0, .22)
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: #a4dff7;
      margin: 0 0 10px
    }

    a {
      color: #000000;
      text-decoration: none;
      transition: color .2s
    }

    h1 {
      font-size: clamp(27px, 4vw, 54px);
      line-height: 1.08;
      letter-spacing: .05em;
      margin: 0 0 12px;
      text-transform: uppercase
    }

    p {
      line-height: 1.6;
      color: #d4e1e9;
      margin: 0
    }

    .actions {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 11px 22px;
      border: 1px solid #91dcf5;
      color: #09131b;
      background: #a5e6fa;
      font-size: 12px;
      letter-spacing: .13em;
      text-transform: uppercase;
      font-weight: 750;
      text-decoration: none;
      transition: background .2s, transform .2s
    }

    .button:hover {
      background: #d1f4ff;
      transform: translateY(-2px)
    }

    .button.secondary {
      background: rgba(6, 16, 26, .55);
      color: #f3fbff;
      border-color: rgba(210, 237, 250, .45)
    }

    .button.secondary:hover {
      background: rgba(37, 63, 80, .75)
    }

    footer {
      font-size: 11px;
      letter-spacing: .12em;
      color: #c3d3df;
      text-transform: uppercase
    }

    footer span:last-child {
      text-align: right
    }

    @media(max-width:650px) {
      .scene::before {
        background-position: center center;
        background-size: auto 100%;
      }

      .shell {
        padding-inline: 18px
      }

      header {
        align-items: flex-start
      }

      .status {
        font-size: 9px;
        letter-spacing: .09em
      }

      .brand {
        font-size: 13px;
        letter-spacing: .14em
      }

      .mark {
        width: 24px;
        height: 24px
      }

      .mark span {
        font-size: 12px
      }

      main {
        padding-bottom: clamp(26px, 6vh, 65px)
      }

      .panel {
        padding: 18px 16px 20px;
        width: 100%
      }

      footer {
        font-size: 9px;
        letter-spacing: .04em;
        gap: 10px
      }
    }

    @media(max-height:600px) and (min-width:651px) {
      main {
        padding: 20px 0
      }

      .panel {
        padding: 12px 20px
      }

      h1 {
        font-size: 30px
      }

      .actions {
        margin-top: 12px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .button {
        transition: none
      }
    }
  </style>
</head>

<body>
  <div class="scene" role="img"
    aria-label="Isometric science-fiction base with CENTRAL-shaped rooftops on a lunar landscape"></div>
  <div class="shell">
    <header><a class="brand" href="/" aria-label="Base Central home"><span class="mark"
          aria-hidden="true"><span>◆</span></span>Base Central</a><span class="status"><span class="dot"></span>Systems
        online</span></header>
    <main>
      <section class="panel" aria-labelledby="welcome">
        <p class="eyebrow">Welcome to</p>
        <h1 id="welcome">Base CENTRAL</h1>  
        <div class="actions"><p class="button">You seem to be lost. Are you looking for &nbsp;<a id="way-out" href="https://www.google.com">Google</a>?</p></div>
  <script>
    (function () {
      var places = [
        { href: "https://www.agendalx.pt", label: "Agenda LX" },
        { href: "https://www.visit.brussels/en/visitors/agenda", label: "Brussels agenda" },
        { href: "https://visit.gent.be/en", label: "Gent Agenda" },
        { href: "https://agendaculturalporto.org", label: "Agenda Porto" },
        { href: "https://www.google.com", label: "Google" }
      ];
      var pick = places[Math.floor(Math.random() * places.length)];
      var link = document.getElementById("way-out");
      link.href = pick.href;
      link.textContent = pick.label;
    })();
  </script>
      </section>
    </main>
    <footer><span>BASECENTRAL.LINK</span><span>Est. on the frontier</span></footer>
  </div>
</body>

</html>
