<html lang="en">
<head>

  <meta name="referrer" content="no-referrer">

  <title>You seem to be lost</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --sky-top: #8eafbf;
      --sky-bottom: #f3ead6;
      --sun: #f6e3a4;
      --mesa: #c9b08a;
      --mesa-far: #d7c4a4;
      --dune: #e7d3a8;
      --dune-mid: #d8c094;
      --shade: #c4a67a;
      --sand: #f4e6c8;
      --metal: #8d9ea6;
      --metal-dark: #5c6c74;
      --metal-top: #d5e0e3;
      --glow: #e7eef0;
      --panel: #314852;
      --panel-line: #8eb0be;
      --mark: #f7f4ee;
      --ink: #24302c;
      --link: #1d4c52;
      color-scheme: light;
    }

    [data-sky="dawn"] {
      --sky-top: #e7a48c;
      --sky-bottom: #f6ddc4;
      --sun: #f3c48a;
      --mesa: #c49878;
      --mesa-far: #dbb498;
      --dune: #e4c49a;
      --dune-mid: #d2ae84;
      --shade: #b88862;
      --sand: #f0d8b4;
      --metal: #9a8e86;
      --metal-dark: #6e5e58;
      --metal-top: #ead8cc;
      --glow: #ffd2a8;
      --panel: #4a4038;
      --panel-line: #e2b48a;
      --mark: #fff6ee;
      --ink: #3a2a28;
      --link: #8a3e32;
    }

    [data-sky="dusk"] {
      --sky-top: #c4624a;
      --sky-bottom: #3c3558;
      --sun: #f0a06a;
      --mesa: #a07858;
      --mesa-far: #c49070;
      --dune: #c9a06e;
      --dune-mid: #a88458;
      --shade: #7a5a40;
      --sand: #d8b888;
      --metal: #7e8490;
      --metal-dark: #3e4650;
      --metal-top: #c8c0b4;
      --glow: #f0b070;
      --panel: #2c3148;
      --panel-line: #e0b090;
      --mark: #fff1dc;
      --ink: #f6efe4;
      --link: #ffd7a8;
    }

    [data-sky="night"] {
      --sky-top: #101826;
      --sky-bottom: #243044;
      --sun: #f4f0e4;
      --mesa: #3a342c;
      --mesa-far: #4a4036;
      --dune: #4e4538;
      --dune-mid: #3c342c;
      --shade: #2a241e;
      --sand: #5c5144;
      --metal: #4a565e;
      --metal-dark: #2a3238;
      --metal-top: #6a787e;
      --glow: #8fd9cc;
      --panel: #1c2830;
      --panel-line: #7ec8c4;
      --mark: #e7fff8;
      --ink: #f4ecdf;
      --link: #b7efe4;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      min-height: 100%;
      background: var(--sky-bottom);
      color: var(--ink);
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    }

    .scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .sky, .land, .stars, .sun, .moon, .glow {
      transition: fill 1.6s linear, opacity 1.6s linear, stroke 1.6s linear;
    }

    .stars, .moon { opacity: 0; }
    [data-sky="night"] .stars,
    [data-sky="night"] .moon { opacity: 1; }
    [data-sky="night"] .sun { opacity: 0; }


    .mark {
      fill: var(--mark);
      font-weight: 650;
    }
    .bramble {
      fill: none;
      stroke: #6e4e32;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    [data-sky="dusk"] .bramble { stroke: #e4c4a0; }
    [data-sky="night"] .bramble { stroke: #e6d0ae; }

    .beacon { opacity: 0.45; }
    [data-sky="night"] .beacon,
    [data-sky="dusk"] .beacon { animation: blink 2.6s ease-in-out infinite; }

    @keyframes blink {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }

    .glow { opacity: 0.35; }
    [data-sky="dawn"] .glow { opacity: 0.45; }
    [data-sky="dusk"] .glow { opacity: 0.75; }
    [data-sky="night"] .glow { opacity: 1; }

    .weed {
      opacity: 0;
      animation: cross 26s linear infinite;
    }

    .weed-late { animation-delay: -13s; }

    @keyframes cross {
      0% { transform: translate(300px, 270px) rotate(0deg) scale(1.35); opacity: 0; }
      8% { opacity: 1; }
      40% { transform: translate(680px, 400px) rotate(200deg) scale(1.35); opacity: 1; }
      48%, 100% { transform: translate(820px, 450px) rotate(260deg) scale(1.35); opacity: 0; }
    }

    .message {
      position: relative;
      z-index: 1;
      max-width: 34rem;
      margin: 0;
      padding: 12vh 8vw 0;
      font-size: clamp(1.7rem, 3.4vw, 2.55rem);
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -0.02em;
      text-wrap: pretty;
    }

    a {
      color: var(--link);
      text-underline-offset: 0.16em;
    }

    a:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 4px;
    }

    @media (max-width: 640px) {
      .message { padding-top: 8vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sky, .land, .stars, .sun, .moon, .glow, .weed {
        transition: none;
      }
      .weed { animation: none; opacity: 0; }
      .beacon { animation: none; opacity: 0.8; }
      .weed-late { opacity: 1; transform: translate(520px, 340px) scale(1.35); }
    }
  </style>
</head>

  <p class="message">You seem to be lost. Are you looking for <a id="way-out" href="https://www.google.com">Google</a>?</p>
  <script>
    (function () {
      var places = [
        { href: "https://www.agendalx.pt", label: "Agenda LX" },
        { href: "https://www.visit.brussels/en/visitors/agenda", label: "the Brussels agenda" },
        { href: "https://visit.gent.be/en", label: "Visit Gent" },
        { href: "https://agendaculturalporto.org", label: "Agenda Cultural Porto" },
        { href: "https://www.google.com", label: "Google" }
      ];
      var pick = places[Math.floor(Math.random() * places.length)];
      var link = document.getElementById("way-out");
      link.href = pick.href;
      link.textContent = pick.label;

      var sun = document.getElementById("sun");
      var root = document.documentElement;

      function paint() {
        var now = new Date();
        var hour = now.getHours() + now.getMinutes() / 60;
        var sky = "night";
        if (hour >= 5 && hour < 8) sky = "dawn";
        else if (hour >= 8 && hour < 17) sky = "day";
        else if (hour >= 17 && hour < 20.5) sky = "dusk";
        root.setAttribute("data-sky", sky);

        var theme = {
          dawn: "#e7a48c",
          day: "#8eafbf",
          dusk: "#c4624a",
          night: "#101826"
        };
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme[sky]);

        var t = (hour - 6) / 14;
        if (t < 0) t = 0;
        if (t > 1) t = 1;
        var x = 90 + t * 1020;
        var y = 250 - Math.sin(t * Math.PI) * 180;
        sun.setAttribute("cx", String(Math.round(x)));
        sun.setAttribute("cy", String(Math.round(y)));
        var halo = document.getElementById("sun-halo");
        if (halo) {
          halo.setAttribute("cx", String(Math.round(x)));
          halo.setAttribute("cy", String(Math.round(y)));
        }
      }

      paint();
      setInterval(paint, 60000);
    }());
  </script>
